<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Gym Schedule v14.3</title>
<style>
  :root { --font-sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --red: #e8352a; --gold: #c4892a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b0b; color: #fff; font-family: var(--font-sans); }
  .page { min-height: 100vh; padding: 20px; }

  /* ── TAB BAR ── */
  .tab-bar { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab-btn {
    padding: 9px 20px; border-radius: 999px; border: 1px solid #2e2e2e;
    background: #141414; color: #aaa; font: 13px/1 var(--font-sans);
    cursor: pointer; transition: all .15s;
  }
  .tab-btn:hover { color: #fff; border-color: #444; }
  .tab-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

  /* ── SHARED ── */
  .section { display: none; }
  .section.visible { display: block; }

  /* ── SCHEDULE SECTION (original) ── */
  .top-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .edit-btn {
    padding: 10px 14px; border: 1px solid #3a3a3a; border-radius: 999px;
    background: #161616; color: #fff; font: inherit; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); display: inline-flex; align-items: center; gap: 8px;
  }
  .edit-btn:hover { background: #1c1c1c; }
  .edit-btn.active { background: var(--red); border-color: var(--red); }
  .hint { margin: 0 0 14px; color: #888; font-size: 12px; text-align: center; }
  .poster { background: #111; border-radius: 12px; padding: 28px 24px; max-width: 980px; margin: 0 auto; }
  .poster-title { text-align: center; font-size: 13px; font-weight: 500; color: #888; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #2a2a2a; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; }
  .cell { background: #111; padding: 16px; }
  .day { font-size: 15px; font-weight: 500; color: var(--red); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 3px; }
  .focus { font-size: 10px; font-weight: 500; color: #ccc; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
  .focus span { color: var(--red); }
  .exercises { list-style: none; padding: 0; margin: 0 0 10px; }
  .exercises li { font-size: 12px; color: #bbb; padding: 1.5px 0; }
  .divider { height: 1px; background: #2a2a2a; margin: 10px 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge { font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
  .b-abs { background: #1a2e44; color: #7ab8f5; border: .5px solid #2a4a6a; }
  .b-run { background: #1a2e1a; color: #7ec87e; border: .5px solid #2a4a2a; }
  .b-str { background: #2e1a14; color: #f0997b; border: .5px solid #4a2a1e; }
  .rest-day { font-size: 22px; font-weight: 500; color: #fff; text-transform: uppercase; letter-spacing: .1em; }
  .rest-sub { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: .1em; }
  .legend { display: flex; gap: 14px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #666; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .editable[contenteditable="true"] { outline: 1px dashed rgba(255,255,255,.25); outline-offset: 2px; border-radius: 4px; padding: 1px 3px; background: rgba(255,255,255,.03); cursor: text; }
  .editable[contenteditable="true"]:focus { outline-color: var(--red); background: rgba(232,53,42,.08); }
  .stretch-toggle { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-sans); }
  .stretch-toggle-label { font-size: 9px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: .1em; }
  .stretch-toggle-arrow { font-size: 9px; color: var(--gold); transition: transform .2s; display: inline-block; }
  .stretch-toggle.open .stretch-toggle-arrow { transform: rotate(90deg); }
  .stretch-line { flex: 1; height: 1px; background: #2a2a2a; margin-bottom: 2px; }
  .stretch-header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .stretch-body { overflow: hidden; max-height: 0; transition: max-height .28s ease; }
  .stretch-body.open, body.editing .stretch-body { max-height: 900px; }
  body.editing .stretch-toggle-arrow { transform: rotate(90deg); }
  .stretch-list { list-style: none; padding: 0; margin: 0 0 6px; }
  .stretch-list li { font-size: 11px; color: #999; padding: 1.5px 0; }
  .stretch-list li::before { content: '↗ '; color: var(--gold); font-size: 9px; }
  .stretch-divider { height: 1px; background: #2a2a2a; margin: 6px 0 10px; }
  .exercises .workout-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
  .workout-text { flex: 1; outline: none; border-radius: 4px; min-width: 0; }
  .workout-text:focus { background: rgba(255,255,255,.04); }
  .delete-workout-btn { display: none; align-items: center; justify-content: center; width: 22px; height: 22px; border: none; border-radius: 999px; background: #2b2b2b; color: #fff; font-size: 16px; line-height: 1; cursor: pointer; flex: 0 0 auto; }
  body.editing .delete-workout-btn { display: inline-flex; }
  body.editing .workout-text { padding: 2px 4px; }
  .add-workout-btn { margin-top: 10px; padding: 6px 10px; background: var(--red); color: white; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .add-workout-btn:hover { opacity: .9; }

  /* ── CALENDAR SECTION ── */
  .cal-wrap { max-width: 820px; margin: 0 auto; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav-btn { background: #1c1c1c; border: 1px solid #2e2e2e; color: #ccc; border-radius: 8px; padding: 7px 14px; cursor: pointer; font: 13px var(--font-sans); }
  .cal-nav-btn:hover { background: #262626; color: #fff; }
  .cal-month-label { font-size: 16px; font-weight: 600; color: #fff; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 10px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .06em; padding: 6px 0; }
  .cal-day {
    background: #111; border: 1px solid #1e1e1e; border-radius: 8px;
    min-height: 70px; padding: 7px; cursor: pointer; transition: border-color .15s, background .15s;
    position: relative;
  }
  .cal-day:hover { border-color: #3a3a3a; background: #161616; }
  .cal-day.today { border-color: var(--red); }
  .cal-day.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
  .cal-day-num { font-size: 11px; font-weight: 600; color: #666; margin-bottom: 4px; }
  .cal-day.today .cal-day-num { color: var(--red); }
  .cal-day-focus { font-size: 9px; color: #aaa; line-height: 1.3; }
  .cal-day-dot-row { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-rest-label { font-size: 9px; color: #444; margin-top: 4px; }

  /* Day detail panel */
  .day-detail-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 100; align-items: flex-start; justify-content: center; padding: 16px;
    overflow-y: auto;
  }
  .day-detail-backdrop.open { display: flex; }
  .day-detail {
    background: #131313; border: 1px solid #2a2a2a; border-radius: 14px;
    width: 100%; max-width: 500px; margin: auto;
    padding: 24px; position: relative;
  }
  .day-detail:focus { outline: none; }
  .day-detail-close {
    position: absolute; top: 14px; right: 14px;
    background: #2a2a2a; border: none; color: #aaa; border-radius: 50%;
    width: 28px; height: 28px; cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .day-detail-close:hover { background: #333; color: #fff; }
  .detail-date { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 4px; }
  .detail-title { font-size: 18px; font-weight: 700; color: #fff; margin: 0 0 2px; }
  .detail-focus { font-size: 11px; color: #aaa; margin: 0 0 4px; }
  .detail-focus span { color: var(--red); }
  .detail-section-label { font-size: 9px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: .1em; margin: 16px 0 8px; border-top: 1px solid #1e1e1e; padding-top: 12px; }
  .detail-list { list-style: none; padding: 0; margin: 0; }
  .detail-list li { font-size: 12px; color: #ccc; padding: 3px 0; border-bottom: 1px solid #1a1a1a; }
  .detail-stretch-list li { font-size: 11px; color: #999; padding: 2px 0; border-bottom: 1px solid #181818; }
  .detail-stretch-list li::before { content: '↗ '; color: var(--gold); }
  .detail-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .detail-rest { text-align: center; padding: 30px 0; }
  .detail-rest-icon { font-size: 36px; margin-bottom: 8px; }
  .detail-rest-text { font-size: 20px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .1em; }
  .detail-rest-sub { font-size: 11px; color: #555; margin-top: 4px; }

  /* ── SETS/REPS TRACKER ── */
  .ex-tracker { margin-bottom: 10px; border: 1px solid #1e1e1e; border-radius: 10px; overflow: hidden; }
  .ex-tracker-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; background: #181818; cursor: pointer; gap: 8px;
  }
  .ex-tracker-header:hover { background: #1c1c1c; }
  .ex-name { font-size: 12px; font-weight: 600; color: #e0e0e0; flex: 1; }
  .ex-summary { font-size: 10px; color: #555; white-space: nowrap; }
  .ex-chevron { font-size: 10px; color: #444; transition: transform .2s; }
  .ex-tracker.open .ex-chevron { transform: rotate(90deg); }
  .ex-body { display: none; padding: 10px 12px 12px; background: #101010; }
  .ex-tracker.open .ex-body { display: block; }

  /* Column headers */
  .sets-col-header {
    display: grid; grid-template-columns: 28px 1fr 1fr 1fr 32px;
    gap: 6px; margin-bottom: 4px; padding: 0 2px;
  }
  .sets-col-header span { font-size: 9px; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  .sets-col-header span:first-child { text-align: left; }

  /* Set row */
  .set-row {
    display: grid; grid-template-columns: 28px 1fr 1fr 1fr 32px;
    gap: 6px; align-items: center; margin-bottom: 5px;
  }
  .set-num { font-size: 10px; color: #555; font-weight: 600; text-align: center; }
  .set-input {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px;
    color: #fff; font: 12px var(--font-sans); padding: 5px 7px;
    text-align: center; width: 100%; outline: none;
  }
  .set-input:focus { border-color: #3a3a3a; background: #1e1e1e; }
  .set-input::placeholder { color: #333; }
  .set-done-cb { width: 18px; height: 18px; accent-color: var(--red); cursor: pointer; margin: 0 auto; display: block; }
  .set-row.completed .set-input { opacity: .45; }
  .set-row.completed .set-num { color: #3a7a55; }

  .add-set-btn {
    margin-top: 8px; padding: 5px 10px; background: none; border: 1px dashed #2a2a2a;
    color: #555; border-radius: 6px; font: 11px var(--font-sans); cursor: pointer; width: 100%;
  }
  .add-set-btn:hover { border-color: #3a3a3a; color: #888; }


  /* Notes area in day detail */
  .detail-notes-label { font-size: 9px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .1em; margin: 16px 0 6px; border-top: 1px solid #1e1e1e; padding-top: 12px; }
  .detail-notes-area {
    width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 8px;
    color: #ccc; font: 12px/1.6 var(--font-sans); padding: 10px 12px;
    resize: vertical; min-height: 64px; outline: none;
  }
  .detail-notes-area:focus { border-color: #3a3a3a; }
  .detail-notes-save { margin-top: 8px; padding: 6px 14px; background: #1f4d2e; border: 1px solid #2f6b44; color: #7ec87e; border-radius: 6px; font: 11px var(--font-sans); cursor: pointer; }
  .detail-notes-save:hover { background: #245a35; }
  .detail-notes-saved { font-size: 10px; color: #3a7a55; margin-left: 8px; display: none; }

  /* Completed indicator on calendar */
  .cal-logged-dot { width: 5px; height: 5px; border-radius: 50%; background: #5ec98a; display: inline-block; margin-left: 3px; vertical-align: middle; }

  .day-select { display:none; margin:0 0 6px; background:#1a1a1a; color:#fff; border:1px solid #3a3a3a; border-radius:6px; padding:4px 8px; font:12px var(--font-sans); cursor:pointer; }
  body.editing .day-select { display:inline-block; }
  .today-tag { display:inline-block; margin-left:8px; font-size:9px; background:var(--red); color:#fff; border-radius:99px; padding:2px 7px; vertical-align:middle; letter-spacing:.06em; }
  .cell.rest-cell { display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; padding:14px 20px; flex-direction:row; }
  .cell.last-wide { grid-column:1/-1; }
  .cal-nav-right { display:flex; gap:6px; }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} .cal-day{min-height:56px;padding:5px;} .cal-day-focus{display:none;} }
  .day-summary { font-size:11px; color:#5ec98a; margin:6px 0 0; }
  .storage-warn { font-size:11px; color:#f0b36b; background:rgba(240,179,107,.1); border-radius:6px; padding:6px 8px; margin-top:8px; }
  .cal-sets { font-size:9px; color:#5ec98a; margin-top:3px; }
  .save-bar { position:sticky; bottom:-24px; background:#131313; padding:12px 0 4px; margin-top:12px; border-top:1px solid #1e1e1e; }
  .stretch-list li { display:flex; align-items:center; gap:6px; }
  .stretch-text { flex:1; min-width:0; outline:none; border-radius:4px; }
  .add-stretch-btn { display:none; margin:2px 0 6px; padding:4px 9px; background:none; border:1px dashed #5a4420; color:var(--gold); border-radius:6px; font-size:10px; cursor:pointer; }
  body.editing .add-stretch-btn { display:inline-block; }

  .focus b { font-weight:500; }
  .focus .int::before { content:'('; } .focus .int::after { content:')'; }
</style>
</head>

<div class="page">
  <div class="tab-bar"><button class="tab-btn active" data-tab="schedule">📋 Schedule</button><button class="tab-btn" data-tab="calendar">📅 Calendar</button></div>

    <div class="hint" id="hint"></div>
    <div class="storage-warn" id="storeWarn" hidden style="max-width:980px;margin:0 auto 14px;text-align:center">⚠ This browser is blocking saving. Changes will be lost when you close this page. Open the file directly in Chrome/Safari to keep your data.</div>
    <div class="poster"><p class="poster-title editable" id="posterTitle" data-s="title"></p><div class="grid" id="grid"></div>

<script>
// First-launch defaults only (bootstrap / old-data migration source). Not live application data.

// ═══ ARCHITECTURE: plan / history / settings are data; the DOM is only a view ═══
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// one storage API: localStorage, with an in-memory copy that always holds the newest value
const Store = {

  get(k, d) { try { const v = k in this.mem ? this.mem[k] : localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch(e) {} return d; },

  raw(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },

function defaultPlan() {   // bootstrap only: used on first launch or when no usable plan exists
  const p = {v:14, workouts:{}, weekdays:{}};
  Object.keys(LEGACY_DEFAULT_WORKOUT_DATA).forEach(k => {
    const d = LEGACY_DEFAULT_WORKOUT_DATA[k], id = DID[k];
    p.weekdays[k] = id;
    p.workouts[id] = {name:d.focus || 'Rest Day', intensity:d.intensity || null, rest:!!d.rest, restLabel:d.restLabel || '', restSub:d.restSub || '',

      ex:(d.exercises || []).map(n => ({id:uid(), name:n, targetSets:3})), badges:d.badges.map(b => ({t:b.text, c:b.cls}))};
  });
  return p;
}

// ─── defensive cleaning of stored data (never throws, never invents history) ───
const cleanList = a => Array.isArray(a) ? a.map(str).map(s => s.trim()).filter(Boolean) : [];
const cleanBadges = a => Array.isArray(a) ? a.filter(isObj).map(b => ({t:str(b.t).trim(), c:COL[b.c] ? b.c : 'b-str'})).filter(b => b.t) : [];

    let id = str(e.id); if (!id || seen.has(id)) id = uid(); seen.add(id);
    const ts = Math.floor(+e.targetSets);

  });
}

  return {name:str(w.name).trim() || (rest ? 'Rest Day' : 'Workout'), intensity:inten || null, rest,
    restLabel:str(w.restLabel).trim() || (rest ? 'Rest Day' : ''), restSub:str(w.restSub).trim(),
    pre:cleanList(w.pre), post:cleanList(w.post), ex:cleanEx(w.ex), badges:cleanBadges(w.badges)};
}

  const out = {v:14, workouts:{}, weekdays:{}};
  IDS.forEach(id => { out.workouts[id] = cleanWorkout(p.workouts[id], id, dp); });
  const wd = isObj(p.weekdays) ? p.weekdays : {}, vals = [0,1,2,3,4,5,6].map(d => wd[d]);
  const ok = vals.every(v => IDS.includes(v)) && new Set(vals).size === 7;   // must be a permutation of the 7 workouts

}
const cleanSets = a => Array.isArray(a) ? a.filter(isObj).map(s => ({weight:str(s.weight), reps:str(s.reps), rpe:str(s.rpe), done:!!s.done})) : null;

    pre:cleanList(s.pre), post:cleanList(s.post), badges:cleanBadges(s.badges),

}
function cleanHist(H) {

    const e = H[key];

    const ex = {}, names = {};

const cleanSet = s => Object.assign({}, isObj(s) ? s : {}, {title:(isObj(s) && str(s.title).trim() || 'Weekly Training Schedule').slice(0, MAX_TEXT)});

// ─── migration: v13 (DOM-saved) → v14 (structured). Runs only when no v14 plan exists at all. ───
function legacySource() { const o = {}; Store.keys().forEach(k => { if (k.startsWith('gym') && !k.startsWith('gymV14')) o[k] = Store.raw(k); }); return o; }
function migrate(src = legacySource()) {

  const P = h => new DOMParser().parseFromString('<div>' + h + '</div>', 'text/html').body.firstChild;
  const texts = (h, sel) => [...P(h).querySelectorAll(sel)].map(e => e.textContent.trim()).filter(Boolean);
  try { if (fields['poster-title']) S.title = P(fields['poster-title']).textContent.trim() || S.title; } catch(e) {}

    try {

      if (lists['pre-' + i] != null) w.pre = texts(lists['pre-' + i], '.stretch-text');

}
function load() {
  const p = cleanPlan(Store.get(K.plan));
  if (p) { plan = p; hist = cleanHist(Store.get(K.hist)); settings = cleanSet(Store.get(K.set)); return; }   // normal case: use what is stored
  if (Store.has(K.plan)) { plan = defaultPlan(); hist = cleanHist(Store.get(K.hist)); settings = cleanSet(Store.get(K.set)); }   // plan unreadable: keep logs
  else { const m = migrate(); plan = m.plan; hist = m.hist; settings = cleanSet(m.settings); }   // first launch / old v13 data
  savePlan(); saveHist(); saveSet();
}

// ─── what a given date shows (history wins for logged past days and for days whose workout was later swapped) ───
const snapOf = (w, exs) => ({name:w.name, intensity:w.intensity, rest:w.rest, restLabel:w.restLabel, restSub:w.restSub, pre:w.pre.slice(), post:w.post.slice(), badges:w.badges.map(b => ({...b})), ex:exs.map(e => ({id:e.id, name:e.name}))});

function dayInfo(y, m, d) {

  const cur = date.getDay(), wid = plan.weekdays[cur], w0 = plan.workouts[wid];
  const pw = h && plan.workouts[h.workoutId], sn = h && h.snap;
  const nameOf = id => (h.names && h.names[id]) || (sn && (sn.ex.find(e => e.id === id) || {}).name) || (pw && (pw.ex.find(e => e.id === id) || {}).name) || 'Exercise';

    const exs = uniq([...base, ...Object.keys(h.ex)]).map(id => ({id, name:nameOf(id)}));

function saveDay(flash) {
